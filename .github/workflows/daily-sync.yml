name: Daily Radar Sync
on:
  schedule:
    # 北京时间 14:37 首次发布，18:37 / 22:37 补偿检查；完成后自动跳过。
    - cron: '37 6,10,14 * * *'
  repository_dispatch:
    types: [radar-recovery]
  workflow_dispatch:
    inputs:
      notify:
        description: '发送尚未成功送达的手机推送'
        type: boolean
        default: false
      recovery:
        description: '补偿模式：当天已全部完成则跳过'
        type: boolean
        default: false
      force_refresh:
        description: '重新抓取日报（已送达通道仍不重复推送）'
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: radar-pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.check.outputs.run }}
      date: ${{ steps.check.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 排队/补跑取最新状态，避免读取触发时的旧快照
      - id: check
        env:
          RECOVERY: ${{ inputs.recovery || false }}
          FORCE_REFRESH: ${{ inputs.force_refresh || false }}
          SITE_URL: ${{ vars.SITE_URL || 'https://leeeway.github.io/daily-trend-radar' }}
        run: python3 scripts/daily_state.py check
  daily:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
      RADAR_DATE: ${{ needs.check.outputs.date }}
      RECOVERY: ${{ inputs.recovery || false }}
      FORCE_REFRESH: ${{ inputs.force_refresh || false }}
      SITE_URL: ${{ vars.SITE_URL || 'https://leeeway.github.io/daily-trend-radar' }}
      NOTIFY_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.notify == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Fetch or recover today's digest
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_radar.py
      - name: Commit durable digest before deployment
        if: github.event_name != 'push'
        run: |
          git config user.name "leeeway"
          git config user.email "leeway9527@163.com"
          git add archives/ README.md data/digests/
          if ! git diff --staged --quiet; then
            git commit -m "$(cat commit_summary.txt)"
            git pull --rebase origin main
            git push
          fi
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify today's public article and index
        if: github.event_name != 'push'
        run: python scripts/daily_state.py verify
      - name: Deliver only unfinished channels
        id: notification
        if: github.event_name != 'push' && env.NOTIFY_ENABLED == 'true'
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python scripts/notify.py
      - name: Record full completion
        if: steps.notification.outcome == 'success'
        run: python scripts/daily_state.py complete
      - name: Persist receipts even when one channel fails
        if: always() && (steps.notification.outcome == 'success' || steps.notification.outcome == 'failure')
        run: |
          git config user.name "leeeway"
          git config user.email "leeway9527@163.com"
          mkdir -p data/delivery data/status
          git add data/delivery/ data/status/
          if ! git diff --staged --quiet; then
            git commit -m "chore(radar): persist delivery status [$RADAR_DATE]"
            git pull --rebase origin main
            git push
          fi
      - name: Report daily outcome
        if: always()
        run: |
          echo "## Radar $RADAR_DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "Event: $GITHUB_EVENT_NAME · notification: ${{ steps.notification.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "A missing data/status/$RADAR_DATE.json means recovery is still required." >> "$GITHUB_STEP_SUMMARY"

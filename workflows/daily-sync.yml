name: Daily Radar Sync

on:
  schedule:
    # 每天北京时间约 09:15 自动触发（UTC 01:15）
    - cron: '15 1 * * *'
  workflow_dispatch: # 支持在 GitHub 网页上手动点击「Run workflow」立即触发

jobs:
  sync-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 防机械特征：如果是定时任务触发，随机等待 0 ~ 1200 秒（0~20分钟），使每天提交时间自然离散
      - name: Random Jitter Delay (Anti-Machine Pattern)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 1200))
          echo "Applying random jitter delay of ${DELAY} seconds..."
          sleep ${DELAY}

      - name: Fetch Tech Trends & Generate Report
        run: python3 scripts/fetch_radar.py

      - name: Commit and Push Daily Report
        run: |
          git config --local user.email "leeway9527@163.com"
          git config --local user.name "leeeway"
          
          # 清理临时摘要文件
          COMMIT_MSG=$(cat commit_summary.txt 2>/dev/null || echo "docs(radar): sync tech trends [$(date +'%Y-%m-%d')]")
          rm -f commit_summary.txt
          
          git add archives/ README.md
          
          if git diff --staged --quiet; then
            echo "No updates detected for today."
            exit 0
          fi
          
          git commit -m "$COMMIT_MSG [skip ci]"
          git push

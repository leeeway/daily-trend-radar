name: Daily Radar Sync
on:
  schedule:
    - cron: '15 1 * * *' # 北京时间 09:15；GitHub 调度可能延迟
  workflow_dispatch:
    inputs:
      notify:
        description: '发送已配置的手机推送'
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: radar-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      SITE_URL: ${{ vars.SITE_URL || 'https://leeeway.github.io/daily-trend-radar' }}
    outputs:
      notify: ${{ steps.delivery.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Fetch and archive daily digest
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_radar.py
      - name: Commit report
        id: delivery
        if: github.event_name != 'push'
        run: |
          git config user.name "leeeway"
          git config user.email "leeway9527@163.com"
          git add archives/ README.md
          if ! git diff --staged --quiet; then
            git commit -m "$(cat commit_summary.txt)"
            git push
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Preserve notification for post-deployment delivery
        if: steps.delivery.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: radar-notification
          path: notification.json
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  notify:
    needs: [build, deploy]
    if: needs.build.outputs.notify == 'true' && (github.event_name == 'schedule' || inputs.notify == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: radar-notification
      - name: Send configured channels
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python scripts/notify.py
